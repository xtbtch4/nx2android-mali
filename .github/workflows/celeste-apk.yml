name: Celeste Android game build

on:
  workflow_dispatch:
  push:
    paths:
      - 'nxnative/**'
      - 'porter/**'
      - '.github/workflows/celeste-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Show runner disk space
        run: |
          df -h
          df -i

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the uploaded Celeste files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p game
          gh release download celeste-data-v1 --repo "${GITHUB_REPOSITORY}" --dir game
          ls -lh game
          test -s game/celeste-base.nsz
          test -s game/celeste-update.nsz
          test -s game/prod.keys
          test -s game/title.keys

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # GitHub's hosted Ubuntu image already includes Android command-line tools.
      # Do not use setup-android here: its legacy "tools" package request fails
      # against current Google SDK repositories.
      - name: Install Android SDK components and NDK r27c
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ||             test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Check porting toolchain
        run: |
          python -m porter doctor -k game/prod.keys
          python -m porter inspect game -k game/prod.keys

      - name: Port Celeste and build APK plus data pack
        run: |
          mkdir -p out
          python -m porter port game -k game/prod.keys -o out --jobs 2 --progress lines

      - name: Verify APK and data pack
        run: |
          find out -maxdepth 2 -type f -printf '%p %s bytes\n' | head -200
          APK="$(find out -maxdepth 1 -type f -name '*.apk' -print -quit)"
          DATA="$(find out -maxdepth 1 -type d -name '*-data' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          test -n "$DATA"
          test -d "$DATA"

      - name: Archive game data pack
        run: |
          cd out
          DATA="$(find . -maxdepth 1 -type d -name '*-data' -print -quit)"
          zip -qr "${DATA#./}.zip" "$DATA"
          ls -lh *.apk *-data.zip

      - name: Upload playable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celeste-android-apk-and-data
          path: |
            out/*.apk
            out/*-data.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
