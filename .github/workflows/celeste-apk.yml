name: Celeste Mali Runtime APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'nxnative/**'
      - '.github/workflows/celeste-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install NDK r27c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure shader compiler
        run: |
          mkdir -p "$ANDROID_NDK_HOME/shader-tools/linux-x86_64"
          ln -sf "$(command -v glslc)" "$ANDROID_NDK_HOME/shader-tools/linux-x86_64/glslc"

      - name: Build Celeste native library
        run: |
          python3 nxnative/dm/android/build.py \
            --game 01002B30028F6000 \
            --ndk "$ANDROID_NDK_HOME" \
            --out "$GITHUB_WORKSPACE/out/celeste" \
            --api 31 --jobs 2 --lib --release --gfx vk

      - name: Package runtime APK
        run: |
          python3 nxnative/dm/android/apk/mkapk.py \
            out/celeste/libdmhost.so \
            out/apk/Celeste-Mali-runtime.apk \
            --package org.nx2a.celeste \
            --label "Celeste (Mali test)" \
            --lib dmhost --landscape --release \
            --version-code 1 --version-name "Mali-dev"

      - name: Verify APK
        run: |
          test -s out/apk/Celeste-Mali-runtime.apk
          file out/apk/Celeste-Mali-runtime.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: celeste-mali-runtime-apk
          path: out/apk/Celeste-Mali-runtime.apk
          retention-days: 7
